    <script>
      // Google tag (gtag.js) — stub + configuration mis en file d'attente
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-18M80J3523');

      // Microsoft Clarity — stub mis en file d'attente
      window.clarity = window.clarity || function () {
        (window.clarity.q = window.clarity.q || []).push(arguments);
      };

      // Les scripts distants ne sont chargés qu'après le rendu : interaction utilisateur ou 4 s après le load
      (function () {
        var loaded = false;
        function loadAnalytics() {
          if (loaded) return;
          loaded = true;
          var g = document.createElement('script');
          g.async = true;
          g.src = 'https://www.googletagmanager.com/gtag/js?id=G-18M80J3523';
          document.head.appendChild(g);
          var c = document.createElement('script');
          c.async = true;
          c.src = 'https://www.clarity.ms/tag/yw1fqwyc08?ref=bwt';
          document.head.appendChild(c);
        }
        ['pointerdown', 'touchstart', 'keydown', 'wheel', 'scroll'].forEach(function (ev) {
          window.addEventListener(ev, loadAnalytics, { once: true, passive: true });
        });
        function schedule() { setTimeout(loadAnalytics, 4000); }
        if (document.readyState === 'complete') { schedule(); }
        else { window.addEventListener('load', schedule, { once: true }); }
      })();
    </script>

    <!-- External Services : Elfsight (avis Google) chargé à la demande, jamais au chargement initial -->
    <link rel="dns-prefetch" href="https://universe-static.elfsightcdn.com">
    <script>
      (function () {
        var loaded = false;
        function loadElfsight() {
          if (loaded) return;
          loaded = true;
          var s = document.createElement('script');
          s.src = 'https://elfsightcdn.com/platform.js';
          s.async = true;
          document.head.appendChild(s);
        }

        // 1) Dès que la section des avis approche du viewport (aucun scroll requis côté PSI)
        var observed = false;
        function watchReviews() {
          if (observed) return true;
          var el = document.querySelector('#avis, [class*="elfsight-app"]');
          if (!el) return false;
          observed = true;
          if ('IntersectionObserver' in window) {
            var io = new IntersectionObserver(function (entries) {
              for (var i = 0; i < entries.length; i++) {
                if (entries[i].isIntersecting) {
                  io.disconnect();
                  loadElfsight();
                  break;
                }
              }
            }, { rootMargin: '400px 0px' });
            io.observe(el);
          } else {
            loadElfsight();
          }
          return true;
        }

        function init() {
          watchReviews();
          if (!observed && 'MutationObserver' in window) {
            var mo = new MutationObserver(function () {
              if (watchReviews()) mo.disconnect();
            });
            mo.observe(document.documentElement, { childList: true, subtree: true });
            setTimeout(function () { mo.disconnect(); }, 15000);
          }
          // 2) Filet de sécurité : première interaction utilisateur
          ['pointerdown', 'touchstart', 'keydown', 'wheel'].forEach(function (ev) {
            window.addEventListener(ev, loadElfsight, { once: true, passive: true });
          });
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', init, { once: true });
        } else {
          init();
        }
      })();
    </script>
